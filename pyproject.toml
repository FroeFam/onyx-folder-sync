[project]
name = "onyx-folder-sync"
version = "0.0.0"
description = "Keeps local or mounted folders in sync with an Onyx knowledge base through the Onyx Ingestion API."
authors = [{ name = "FroeFam" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "PyYAML>=6.0",
    "pathspec>=0.12",
    "typer>=0.15",
    "filelock>=3.16",
    "charset-normalizer>=3.4",
    "pypdfium2>=5.0",
    "markitdown[docx,pptx,xlsx]>=0.1.3",
]

[project.scripts]
onyx-folder-sync = "onyx_folder_sync.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
]

[tool.uv]
# CI (astral-sh/setup-uv) installs the uv version that satisfies this range.
required-version = ">=0.13.7,<0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]